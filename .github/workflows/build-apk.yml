name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --licenses
          yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Patch Kotlin version
        run: |
          sed -i 's/kotlinVersion = "1.9.24"/kotlinVersion = "1.9.25"/' android/build.gradle
          sed -i 's/1.9.24/1.9.25/' android/gradle.properties
          echo "ANDROID_COMPILE_SDK=34" >> android/gradle.properties

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
